<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakubia - Official Space Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #05050a url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* Dunkler Overlay-Effekt für besseren Kontrast */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.75);
            z-index: 1;
        }
        /* Die glühende App-Card in der Mitte */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(26, 26, 36, 0.85);
            border: 2px solid #5a0099;
            box-shadow: 0 0 30px rgba(90, 0, 153, 0.5), inset 0 0 15px rgba(0, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(10px);
        }
        .game-icon {
            width: 120px;
            height: 120px;
            border-radius: 26px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        p {
            color: #88aaff;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        /* Der fetteste Play Store Button des Universums */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #5a0099;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 16px;
            border: 2px solid #aa55ff;
            box-shadow: 0 4px 15px rgba(90, 0, 153, 0.4);
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            background: #7300c2;
            box-shadow: 0 0 25px #aa55ff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <!-- Dein App Icon -->
        <img src="icon.png" alt="Yakubia Icon" class="game-icon">
        
        <!-- Titel & Untertitel -->
        <h1>YAKUBIA</h1>
        <p>Sammle Dunkle Materie und schalte im Quantenlabor mächtige Elementare Booster frei!</p>
        
        <!-- Dein Google Play Link -->
        <a href="https://play.google.com/store/apps/details?id=com.spacegame.yakubia" class="btn-download" target="_blank">
            <span>Jetzt bei Google Play</span>
        </a>
        <footer>
            
        <br>
        <br>
            <p>&copy; 2026 Yakubia. All Rights Reserved.</p>
    
    </div>
</body>
</html>
