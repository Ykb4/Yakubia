<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakubia - Official Space Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #05050a url('Screenshot_20260429_135359_Yakubia(1).jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.75);
            z-index: 1;
        }
        .card {
            position: relative;
            z-index: 2;
            background: rgba(26, 26, 36, 0.85);
            border: 2px solid #5a0099;
            box-shadow: 0 0 30px rgba(90, 0, 153, 0.5), inset 0 0 15px rgba(0, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        .game-icon {
            width: 120px;
            height: 120px;
            border-radius: 26px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .description {
            color: #88aaff;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #5a0099;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 16px;
            border: 2px solid #aa55ff;
            box-shadow: 0 4px 15px rgba(90, 0, 153, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn-download:hover {
            background: #7300c2;
            box-shadow: 0 0 25px #aa55ff;
            transform: translateY(-2px);
        }
        .site-footer {
            position: relative;
            z-index: 2;
            margin-top: 30px;
            font-size: 0.85rem;
            text-align: center;
        }
        .site-footer a {
            color: #555577;
            text-decoration: none;
            transition: color 0.2s;
        }
        .site-footer a:hover {
            color: #ffffff;
        }
        .site-footer .copyright {
            color: #444455;
            font-size: 0.8rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        
        <img src="25415.png" alt="Yakubia Icon" class="game-icon">
        
        <h1>YAKUBIA</h1>
        <p class="description">Collect Dark Matter and unlock powerful Elemental Boosters in the Quantum Lab!</p>
        
        <a href="https://play.google.com/store/apps/details?id=com.spacegame.yakubia" class="btn-download" target="_blank">
            <span>Now on Google Play</span>
        </a>
        
    </div>

    <footer class="site-footer">
        <a href="app-ads.txt" target="_blank">Ad-Verification (app-ads.txt)</a>
        <p class="copyright">&copy; 2026 SpaceGame Studios. All Rights Reserved.</p>
    </footer>

</body>
</html>
